[project]
name = "ai-rag-engine"
version = "0.1.0"
description = "퇴직연금 상담 챗봇 RAG 엔진 (Indexing / Retrieval / Rerank / Context 생성)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # --- Ingest ---
    "pdfplumber>=0.11.4",
    # --- Embedding / Rerank ---
    "sentence-transformers>=3.2.0",
    # --- Retrieval ---
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "pymupdf>=1.28.2",
    "openai>=3.2.0",
    "kiwipiepy>=0.23.2",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.3.0",
]
